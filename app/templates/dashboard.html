<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Mikura - Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <div class="dashboard">
    <div class="topbar">
      <div>
        <h1 style="margin:0">Mikura Dashboard</h1>
        <span id="whoami"></span>
      </div>
      <button id="logout" style="width:auto;padding:0.4rem 1rem;">Log out</button>
    </div>

    <div class="card">
      <h3>Register project</h3>
      <div class="new-project">
        <input id="project-search-input" placeholder="Search Shigure projects (name / code / captain)" />
        <button id="project-search-btn">Search</button>
      </div>
      <ul id="project-search-results" class="search-results"></ul>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Project</th>
            <th>Latest status</th>
            <th>Files</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="project-rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('mikura_token');
    let user = null;
    try {
      user = JSON.parse(localStorage.getItem('mikura_user'));
    } catch (err) {
      user = null;
    }

    if (!token) {
      window.location.href = '/login';
    }

    document.getElementById('whoami').textContent = user ? `Signed in as ${user.name}` : '';
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('mikura_token');
      localStorage.removeItem('mikura_user');
      window.location.href = '/login';
    });

    function authHeaders() {
      return { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    async function api(path, options = {}) {
      const res = await fetch(path, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
      if (res.status === 401 || res.status === 403) {
        window.location.href = '/login';
        throw new Error('Unauthorized');
      }
      if (!res.ok) throw new Error(`Request failed: ${res.status}`);
      if (res.status === 204) return null;
      return res.json();
    }

    async function loadProjects() {
      const projects = await api('/projects/');
      const tbody = document.getElementById('project-rows');
      tbody.innerHTML = '';

      for (const project of projects) {
        const [status, files] = await Promise.all([
          api(`/projects/${project.id}/status`).catch(() => null),
          api(`/projects/${project.id}/files/`).catch(() => []),
        ]);

        const tr = document.createElement('tr');

        const statusBadge = status
          ? `<span class="badge ${status.build_status}">${status.build_status}</span>`
          : '<span class="badge">no builds</span>';

        const fileLinks = files
          .map((f) => `<a href="/download/${project.id}/${f.id}?token=${encodeURIComponent(token)}">${f.file_name}</a>`)
          .join('<br/>');

        tr.innerHTML = `
                    <td>${project.name}<br/><small>${project.description || ''}</small></td>
                    <td>${statusBadge}</td>
                    <td>${fileLinks || '-'}</td>
                    <td class="actions"></td>
                `;

        const actionsCell = tr.querySelector('.actions');

        const buildBtn = document.createElement('button');
        buildBtn.textContent = 'Build now';
        buildBtn.onclick = async () => {
          buildBtn.disabled = true;
          try {
            await api(`/projects/${project.id}/build`, { method: 'POST' });
            await loadProjects();
          } finally {
            buildBtn.disabled = false;
          }
        };

        const scheduleBtn = document.createElement('button');
        scheduleBtn.textContent = 'Schedule weekly';
        scheduleBtn.onclick = async () => {
          await api(`/projects/${project.id}/schedule`, {
            method: 'POST',
            body: JSON.stringify({ is_active: true, day_of_week: 'mon', hour: 2, minute: 0 }),
          });
          alert('Scheduled for weekly build (Mon 02:00).');
        };

        const removeBtn = document.createElement('button');
        removeBtn.textContent = 'Remove';
        removeBtn.style.color = 'red';
        removeBtn.onclick = async () => {
          if (!confirm(`Are you sure you want to remove project "${project.name}"?`)) {
            return;
          }
          removeBtn.disabled = true;
          try {
            await api(`/projects/${project.id}`, { method: 'DELETE' });
            await loadProjects();
          } catch (err) {
            alert('Failed to remove project.');
            removeBtn.disabled = false;
          }
        };

        actionsCell.append(buildBtn, scheduleBtn, removeBtn);
        tbody.appendChild(tr);
      }
    }

    async function searchShigureProjects() {
      const q = document.getElementById('project-search-input').value.trim();
      const results = document.getElementById('project-search-results');
      results.innerHTML = '';
      if (!q) return;

      let matches;
      try {
        matches = await api(`/projects/shigure/search?q=${encodeURIComponent(q)}`);
      } catch (err) {
        results.innerHTML = '<li class="empty">Search failed. Please try again.</li>';
        return;
      }

      if (!matches.length) {
        results.innerHTML = '<li class="empty">No matching projects found.</li>';
        return;
      }

      for (const match of matches) {
        const li = document.createElement('li');
        li.innerHTML = `<span>${match.name}<br/><small>${match.code} · ${match.captain}</small></span>`;

        const addBtn = document.createElement('button');
        addBtn.textContent = 'Add';
        addBtn.onclick = async () => {
          addBtn.disabled = true;
          try {
            await api('/projects/', {
              method: 'POST',
              body: JSON.stringify({ name: match.name, description: `${match.code} · ${match.captain}` }),
            });
            document.getElementById('project-search-input').value = '';
            results.innerHTML = '';
            await loadProjects();
          } catch (err) {
            alert('Failed to add project (it may already be registered).');
            addBtn.disabled = false;
          }
        };

        li.appendChild(addBtn);
        results.appendChild(li);
      }
    }

    document.getElementById('project-search-btn').addEventListener('click', searchShigureProjects);
    document.getElementById('project-search-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchShigureProjects();
    });

    loadProjects().catch((err) => console.error(err));
  </script>
</body>

</html>

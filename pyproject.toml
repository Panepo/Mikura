[project]
name = "mikura"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp[cli]<2",
    "passlib[bcrypt]>=1.7.4",
    "poethepoet>=0.37.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.poe.tasks]
dev = "uvicorn app.main:app --host 127.0.0.1 --port 7700 --reload"

[tool.pytest.ini_options]
addopts = "-s"
